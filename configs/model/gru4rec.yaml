# @package _global_

train_dir: gru4rec

model_args:
  name: gru4rec
  backbone: gru4rec
  train_patcher: false
  maxlen: 200
  layers: [64]
  dropout_rate: 0.0
  dropout_p_embed: 0.0
  dropout_p_hidden: 0.0
  embedding: 0
  constrained_embedding: true

training_args:
  batch_size: 128
  lr: 0.001
  loss: bpr
  num_epochs: 500
  device: cuda
  eval_neg_sample: 1000
  val_interval: 10
