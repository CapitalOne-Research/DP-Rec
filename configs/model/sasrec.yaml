# @package _global_

train_dir: sasrec

model_args:
  name: sas
  backbone: sas
  maxlen: 200
  dropout_rate: 0.2
  hidden_units: 64
  num_heads: 1
  num_blocks: 3 

training_args:
  batch_size: 128
  lr: 0.001
  loss: bpr
  num_negatives: 1
  num_epochs: 500
  device: cuda
  eval_neg_sample: 1000
  val_interval: 10